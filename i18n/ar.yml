meta:
  title: Wijaya — قراءة وكتابة أقراص NTFS على Mac (مجاني ومفتوح المصدر)
  description: يتيح Wijaya قراءة وكتابة أقراص NTFS — HDD أو SSD أو NVMe — على macOS. مجاني، مفتوح المصدر (MIT)، مبني على ntfs-3g + FUSE-T.
