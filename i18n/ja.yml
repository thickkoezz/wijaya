hero:
  eyebrow: 無料・オープンソース · MIT
  title: Mac で NTFS ディスクを読み書き — 有料ソフトは不要。
  lead: Wijaya は <strong>NTFS ディスク</strong>（HDD / SSD / NVMe / USB メモリ）を Finder から書き込み可能にします。<code>ntfs-3g</code> + FUSE-T を利用。
  download: ダウンロード (.dmg)
  source: ソースを見る
  note: <strong>有料の Developer ID は使いません。</strong> Apple の署名がないため、初回は<strong>右クリック → 開く</strong>だけで大丈夫です（Homebrew なら警告は出ません）。ご理解に感謝します。
  shot_caption: Wijaya.app — ボリューム検出、ワンクリックでマウント、透明なログ。
features:
  eyebrow: なぜ Wijaya
  title: 他の無料ツールが諦める環境でも動きます
  c1_title: kext 不要（FUSE-T）
  c1_desc: カーネル拡張が不要で、セキュリティを下げる必要も、リカバリモードでの再起動も不要です。
  c2_title: 本物の読み書き
  c2_desc: <code>ntfs-3g</code> による Read-Write マウント。Read-Only、Unmount、Eject、Repair も備えます。
  c3_title: 自動マウント
  c3_desc: オプション — NTFS ディスクを挿すと、クリックもパスワードも不要で read-write でマウントします。
format:
  eyebrow: フォーマットと媒体
  title: 決めるのはファイルシステム、ディスクの種類ではありません
  lead: HDD、SSD、NVMe、USB メモリ、SD カード — どれも同じです。Wijaya は NTFS に特化。
  n_title: NTFS → Wijaya が必要
  n_desc: macOS は NTFS を<em>読む</em>ことしかできません。Wijaya は <code>ntfs-3g</code> で完全な読み書きを提供します。NTFS の SSD も同様です。
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: macOS で既に読み書き可能です。Wijaya は状態付きで一覧に表示します。
  footnote: ext4 / Btrfs（Linux）は未対応です。
shots:
  eyebrow: スクリーンショット
  title: ごく普通の Mac アプリの見た目
  alt1: NTFS ディスクと状態、マウントボタンを表示する Wijaya のウィンドウ
