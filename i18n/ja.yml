install:
  eyebrow: インストール
  title: 完全ガイド（5 ステップ）
  lead: およそ 5 分。Homebrew と Apple Silicon 上の macOS 14+ が必要です。
  s1_title: FUSE-T をインストール（前提）
  s1_desc: FUSE-T はカーネル拡張なしで FUSE レイヤーを提供します。
  s2_title: Wijaya をダウンロードしてインストール
  s2_desc: Releases から <code>.dmg</code> を取得して開き、インストーラを実行します。Apple の署名がないため<strong>右クリック → 開く</strong>で開きます。
  s3_title: Full Disk Access を許可
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>。macOS は root でも <code>/dev/disk</code> を遮断するため必須です。
  s4_title: Wijaya を開いてマウント
  s4_desc: NTFS ディスクを挿す → <strong>Mount Read-Write</strong> をクリック → 管理者パスワードを入力。
  s5_title: 取り外す前に必ず Eject
  s5_desc: FUSE-T には書き込みキャッシュがあります。先に <strong>Eject</strong> を押してから抜いてください。
  readme: ソースからビルドしたい場合の手順は README にあります。
faq:
  eyebrow: FAQ
  title: よくある質問
  q1: なぜ “unidentified developer” の警告が出る？
  a1: パッケージが Apple の署名を受けていないためです。公式署名には年 99 ドルの Apple Developer Program が必要で、このプロジェクトは無料を選びました。
  q2: なぜ Full Disk Access が必要？
  a2: macOS Sequoia 以降、TCC は root プロセスでも <code>/dev/disk</code> へのアクセスを遮断します。
  q3: “NTFS hibernated / unsafe state” と出た。
  a3: Windows から正常にシャットダウンされていません（Fast Startup）。Windows を起動して Fast Startup を無効にし、完全にシャットダウンしてください。
  q4: 重要なデータでも安全？
  a4: 抜く前に必ず <strong>Eject</strong> をクリック。そしてバックアップを保ってください。
