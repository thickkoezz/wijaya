meta:
  title: Wijaya — Mac で NTFS ディスクを読み書き（無料・オープンソース）
  description: Wijaya は NTFS ディスク（HDD / SSD / NVMe）を macOS で読み書き可能にします。無料・オープンソース（MIT）、ntfs-3g + FUSE-T ベース。
