meta:
  title: Wijaya — Mac पर NTFS डिस्क पढ़ें और लिखें (मुफ़्त और ओपन सोर्स)
  description: Wijaya NTFS डिस्क — HDD, SSD या NVMe — को macOS पर पढ़ने-लिखने योग्य बनाता है। मुफ़्त, ओपन सोर्स (MIT), ntfs-3g + FUSE-T पर आधारित।
