meta:
  title: Wijaya — Mac에서 NTFS 디스크 읽기/쓰기 (무료·오픈 소스)
  description: Wijaya는 NTFS 디스크(HDD, SSD, NVMe)를 macOS에서 읽고 쓸 수 있게 합니다. 무료, 오픈 소스(MIT), ntfs-3g + FUSE-T 기반.
