meta:
  title: Wijaya — Baca-tulis disk NTFS di Mac (gratis & open source)
  description: Wijaya membuat disk NTFS — HDD, SSD, atau NVMe — bisa dibaca-tulis di macOS. Gratis, open source (MIT), berbasis ntfs-3g + FUSE-T.
