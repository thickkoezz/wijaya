meta:
  title: Wijaya — Lectura y escritura de discos NTFS en Mac (gratis y open source)
  description: Wijaya permite leer y escribir discos NTFS — HDD, SSD o NVMe — en macOS. Gratis, open source (MIT), sobre ntfs-3g + FUSE-T.
