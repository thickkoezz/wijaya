install:
  eyebrow: Instalación
  title: Guía completa (5 pasos)
  lead: Unos 5 minutos. Requiere Homebrew y macOS 14+ en Apple Silicon.
  s1_title: Instala FUSE-T (requisito)
  s1_desc: FUSE-T aporta la capa FUSE sin extensión de kernel.
  s2_title: Descarga e instala Wijaya
  s2_desc: Baja el <code>.dmg</code> desde Releases, ábrelo y ejecuta el instalador. Como no está firmado por Apple, ábrelo con <strong>clic derecho → Abrir</strong>.
  s3_title: Concede Full Disk Access
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>. Obligatorio, porque macOS bloquea <code>/dev/disk</code> incluso para root.
  s4_title: Abre Wijaya y monta
  s4_desc: Conecta tu disco NTFS → pulsa <strong>Mount Read-Write</strong> → introduce tu contraseña de administrador.
  s5_title: Expulsa siempre antes de desconectar
  s5_desc: FUSE-T usa caché de escritura. Pulsa <strong>Eject</strong> primero y luego desconecta.
  readme: ¿Prefieres compilar desde el código? Los pasos están en el README.
faq:
  eyebrow: FAQ
  title: Preguntas frecuentes
  q1: ¿Por qué aparece el aviso “unidentified developer”?
  a1: Porque el paquete no está firmado por Apple. La firma oficial exige el Apple Developer Program (99 $/año) y este proyecto decidió seguir siendo gratis.
  q2: ¿Por qué hace falta Full Disk Access?
  a2: Desde macOS Sequoia, TCC bloquea el acceso a <code>/dev/disk</code> incluso para procesos root.
  q3: Salió “NTFS hibernated / unsafe state”.
  a3: El disco no se apagó limpiamente desde Windows (Fast Startup). Arranca Windows, desactiva Fast Startup y haz un apagado completo.
  q4: ¿Es seguro para datos importantes?
  a4: Pulsa siempre <strong>Eject</strong> antes de desconectar. Y mantén copias de seguridad.
