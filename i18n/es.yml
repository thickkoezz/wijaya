  github: GitHub
hero:
  eyebrow: Gratis y open source · MIT
  title: Lee y escribe discos NTFS en tu Mac, sin software de pago.
  lead: Wijaya hace que los <strong>discos NTFS</strong> — HDD, SSD, NVMe, memorias USB — se puedan escribir desde Finder, sobre <code>ntfs-3g</code> + FUSE-T.
  download: Descargar (.dmg)
  source: Ver código
  note: <strong>Sin Developer ID de pago.</strong> El paquete no está firmado por Apple, así que la primera vez solo hay que <strong>hacer clic derecho → Abrir</strong> (o instalar con Homebrew, que evita el aviso). Gracias por entenderlo.
  shot_caption: Wijaya.app — detección de volúmenes, montaje en un clic y registro transparente.
features:
  eyebrow: Por qué Wijaya
  title: Funciona donde otras herramientas gratuitas fallan
  c1_title: Sin kext (FUSE-T)
  c1_desc: Sin extensión de kernel, sin reducir la seguridad del sistema y sin reiniciar en modo Recovery.
  c2_title: Lectura y escritura reales
  c2_desc: Montaje Read-Write con <code>ntfs-3g</code>, más Read-Only, Unmount, Eject y Repair.
  c3_title: Auto-montaje
  c3_desc: Opcional — al conectar un disco NTFS se monta en read-write sin clics ni contraseñas.
format:
  eyebrow: Formatos y medios
  title: Decide el sistema de archivos, no el tipo de disco
  lead: HDD, SSD, NVMe, memoria USB, tarjeta SD — todo da igual. Wijaya se centra en NTFS.
  n_title: NTFS → necesita Wijaya
  n_desc: macOS solo puede <em>leer</em> NTFS. Wijaya da lectura y escritura completas con <code>ntfs-3g</code>, también en SSD formateados en NTFS.
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: Ya son de lectura y escritura en macOS. Wijaya igualmente los muestra con su estado.
  footnote: ext4 / Btrfs (Linux) aún no son compatibles.
