meta:
  title: Wijaya — קריאה וכתיבה של כונני NTFS במק (חינם ובקוד פתוח)
  description: Wijaya מאפשר לקרוא ולכתוב כונני NTFS — HDD, SSD או NVMe — ב-macOS. חינם, קוד פתוח (MIT), מבוסס על ntfs-3g + FUSE-T.
