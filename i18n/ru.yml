hero:
  eyebrow: Бесплатно и с открытым кодом · MIT
  title: Читайте и записывайте диски NTFS на Mac — без платных программ.
  lead: Wijaya делает <strong>диски NTFS</strong> — HDD, SSD, NVMe, флешки — доступными для записи в Finder, на основе <code>ntfs-3g</code> + FUSE-T.
  download: Скачать (.dmg)
  source: Исходный код
  note: <strong>Без платного Developer ID.</strong> Пакет не подписан Apple, поэтому при первом запуске просто <strong>ПКМ → Открыть</strong> (или установите через Homebrew — там предупреждения нет). Спасибо за понимание.
  shot_caption: Wijaya.app — обнаружение томов, монтирование в один клик, прозрачный журнал.
features:
  eyebrow: Почему Wijaya
  title: Работает там, где сдаются другие бесплатные инструменты
  c1_title: Без kext (FUSE-T)
  c1_desc: Без расширения ядра, без снижения безопасности системы и без перезагрузки в режим восстановления.
  c2_title: Настоящее чтение и запись
  c2_desc: Монтирование Read-Write через <code>ntfs-3g</code>, а также Read-Only, Unmount, Eject и Repair.
  c3_title: Автомонтирование
  c3_desc: Опционально — при подключении диска NTFS он монтируется read-write без кликов и пароля.
format:
  eyebrow: Форматы и носители
  title: Важна файловая система, а не тип диска
  lead: HDD, SSD, NVMe, флешка, SD-карта — всё равно. Wijaya работает с NTFS.
  n_title: NTFS → нужен Wijaya
  n_desc: macOS умеет только <em>читать</em> NTFS. Wijaya даёт полную запись и чтение через <code>ntfs-3g</code>, включая SSD в NTFS.
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: Уже доступны для записи в macOS. Wijaya всё равно показывает их со статусом.
  footnote: ext4 / Btrfs (Linux) пока не поддерживаются.
shots:
  eyebrow: Скриншоты
