install:
  eyebrow: Установка
  title: Полное руководство (5 шагов)
  lead: Около 5 минут. Нужны Homebrew и macOS 14+ на Apple Silicon.
  s1_title: Установите FUSE-T (обязательно)
  s1_desc: FUSE-T даёт слой FUSE без расширения ядра.
  s2_title: Скачайте и установите Wijaya
  s2_desc: Возьмите <code>.dmg</code> в Releases, откройте и запустите установщик. Он не подписан Apple, поэтому открывайте через <strong>ПКМ → Открыть</strong>.
  s3_title: Выдайте Full Disk Access
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>. Обязательно: macOS блокирует <code>/dev/disk</code> даже для root.
  s4_title: Откройте Wijaya и смонтируйте
  s4_desc: Подключите диск NTFS → нажмите <strong>Mount Read-Write</strong> → введите пароль администратора.
  s5_title: Всегда извлекайте перед отключением
  s5_desc: У FUSE-T есть кэш записи. Сначала нажмите <strong>Eject</strong>, потом отключайте.
  readme: Хотите собрать из исходников? Все шаги есть в README.
faq:
  eyebrow: FAQ
  title: Частые вопросы
  q1: Почему предупреждение “unidentified developer”?
  a1: Пакет не подписан Apple. Официальная подпись требует Apple Developer Program за 99 долларов в год, а проект решил остаться бесплатным.
  q2: Зачем нужен Full Disk Access?
  a2: С macOS Sequoia TCC блокирует доступ к <code>/dev/disk</code> даже для процессов root.
  q3: Появилось “NTFS hibernated / unsafe state”.
  a3: Диск не был корректно выключен из Windows (Fast Startup). Загрузитесь в Windows, отключите Fast Startup и выполните полное завершение работы.
  q4: Это безопасно для важных данных?
  a4: Всегда нажимайте <strong>Eject</strong> перед отключением. И делайте резервные копии.
