meta:
  title: Wijaya — чтение и запись дисков NTFS на Mac (бесплатно, с открытым кодом)
  description: Wijaya позволяет читать и записывать диски NTFS — HDD, SSD или NVMe — в macOS. Бесплатно, с открытым кодом (MIT), на основе ntfs-3g + FUSE-T.
