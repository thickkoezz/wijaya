  alt3: Het fuse-t-volume in Locations van de Finder
  cap3: Verschijnt in Finder
install:
  eyebrow: Installatie
  title: Volledige handleiding (5 stappen)
  lead: Ongeveer 5 minuten. Vereist Homebrew en macOS 14+ op Apple Silicon.
  s1_title: Installeer FUSE-T (voorwaarde)
  s1_desc: FUSE-T levert de FUSE-laag zonder kernel-extensie.
  s2_title: Download en installeer Wijaya
  s2_desc: Pak de <code>.dmg</code> uit Releases, open hem en start de installer. Niet door Apple ondertekend, dus open met <strong>rechtermuisknop → Open</strong>.
  s3_title: Geef Full Disk Access
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>. Verplicht, want macOS blokkeert <code>/dev/disk</code> zelfs voor root.
  s4_title: Open Wijaya en mount
  s4_desc: Sluit je NTFS-schijf aan → klik <strong>Mount Read-Write</strong> → voer je beheerderswachtwoord in.
  s5_title: Werp altijd uit voordat je loskoppelt
  s5_desc: FUSE-T heeft een schrijfcache. Klik eerst <strong>Eject</strong>, koppel daarna los.
  readme: Liever zelf bouwen uit de broncode? Alle stappen staan in de README.
faq:
  eyebrow: FAQ
  title: Veelgestelde vragen
  q1: Waarom de melding “unidentified developer”?
  a1: Omdat het pakket niet door Apple is ondertekend. Officiële ondertekening vereist het Apple Developer Program van $99 per jaar, en dit project blijft bewust gratis.
  q2: Waarom is Full Disk Access nodig?
  a2: Sinds macOS Sequoia blokkeert TCC de toegang tot <code>/dev/disk</code>, zelfs voor root-processen.
  q3: Ik kreeg “NTFS hibernated / unsafe state”.
  a3: De schijf is niet netjes afgesloten vanuit Windows (Fast Startup). Start Windows, schakel Fast Startup uit en sluit volledig af.
  q4: Is het veilig voor belangrijke data?
  a4: Klik altijd <strong>Eject</strong> voordat je loskoppelt. En houd back-ups bij.
