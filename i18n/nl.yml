hero:
  eyebrow: Gratis en open source · MIT
  title: NTFS-schijven lezen én schrijven op je Mac — zonder betaalde software.
  lead: Wijaya maakt <strong>NTFS-schijven</strong> — HDD, SSD, NVMe, usb-sticks — beschrijfbaar in Finder, op basis van <code>ntfs-3g</code> + FUSE-T.
  download: Downloaden (.dmg)
  source: Broncode bekijken
  note: <strong>Geen betaalde Developer ID.</strong> Het pakket is niet door Apple ondertekend; open het de eerste keer met <strong>rechtermuisknop → Open</strong> (of installeer via Homebrew, dat de waarschuwing overslaat). Bedankt voor het begrip.
  shot_caption: Wijaya.app — schijfdetectie, mounten met één klik, transparant logboek.
features:
  eyebrow: Waarom Wijaya
  title: Werkt waar andere gratis tools opgeven
  c1_title: Zonder kext (FUSE-T)
  c1_desc: Geen kernel-extensie, geen verlaagde systeembeveiliging en geen herstart naar Herstelmodus.
  c2_title: Echt lezen en schrijven
  c2_desc: Read-Write mounten via <code>ntfs-3g</code>, plus Read-Only, Unmount, Eject en Repair.
  c3_title: Automatisch mounten
  c3_desc: Optioneel — zodra een NTFS-schijf wordt aangesloten, wordt hij read-write gemount zonder klik en zonder wachtwoord.
format:
  eyebrow: Formaten en media
  title: Het bestandssysteem bepaalt het, niet het soort schijf
  lead: HDD, SSD, NVMe, usb-stick, SD-kaart — allemaal hetzelfde. Wijaya richt zich op NTFS.
  n_title: NTFS → heeft Wijaya nodig
  n_desc: macOS kan NTFS alleen <em>lezen</em>. Wijaya geeft volledig lezen en schrijven via <code>ntfs-3g</code>, ook op NTFS-geformatteerde SSD's.
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: Al lees- en beschrijfbaar op macOS. Wijaya toont ze toch met hun status.
  footnote: ext4 / Btrfs (Linux) worden nog niet ondersteund.
shots:
  eyebrow: Schermafbeeldingen
  title: Ziet eruit als een gewone Mac-app
  alt1: Wijaya-venster met een NTFS-schijf, de status en de mount-knop
  cap1: Hoofdvenster
  alt2: FUSE-T-paneel met een actieve verbinding via NFS
