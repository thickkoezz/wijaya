meta:
  title: Wijaya — NTFS-schijven lezen en schrijven op de Mac (gratis en open source)
  description: Wijaya maakt NTFS-schijven — HDD, SSD of NVMe — beschrijfbaar op macOS. Gratis, open source (MIT), gebouwd op ntfs-3g + FUSE-T.
