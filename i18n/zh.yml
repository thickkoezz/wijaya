hero:
  eyebrow: 免费 · 开源 · MIT
  title: 在 Mac 上读写 NTFS 磁盘 —— 无需付费软件。
  lead: Wijaya 让 <strong>NTFS 磁盘</strong>（HDD / SSD / NVMe / U 盘）在 Finder 中可写，基于 <code>ntfs-3g</code> + FUSE-T。
  download: 下载 (.dmg)
  source: 查看源码
  note: <strong>不使用付费的 Developer ID。</strong> 该安装包没有 Apple 签名，首次打开只需<strong>右键 → 打开</strong>（或通过 Homebrew 安装，不会有警告）。感谢你的理解。
  shot_caption: Wijaya.app —— 自动识别卷宗、一键挂载、透明的日志。
features:
  eyebrow: 为什么选 Wijaya
  title: 在其他免费工具放弃的地方依然可用
  c1_title: 无需 kext（FUSE-T）
  c1_desc: 不需要内核扩展，不必降低系统安全性，也无需进入恢复模式重启。
  c2_title: 真正的读写
  c2_desc: 通过 <code>ntfs-3g</code> 进行 Read-Write 挂载，并提供 Read-Only、Unmount、Eject 与 Repair。
  c3_title: 自动挂载
  c3_desc: 可选 —— 插入 NTFS 磁盘即以 read-write 挂载，无需点击，也无需密码。
format:
  eyebrow: 格式与介质
  title: 决定因素是文件系统，而不是磁盘类型
  lead: HDD、SSD、NVMe、U 盘、SD 卡 —— 都一样。Wijaya 专注于 NTFS。
  n_title: NTFS → 需要 Wijaya
  n_desc: macOS 只能<em>读取</em> NTFS。Wijaya 通过 <code>ntfs-3g</code> 提供完整读写，包括 NTFS 格式的 SSD。
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: 在 macOS 上本来就可读写。Wijaya 仍会列出并显示其状态。
  footnote: ext4 / Btrfs（Linux）暂不支持。
shots:
  eyebrow: 截图
  title: 看起来就是普通的 Mac 应用
  alt1: Wijaya 窗口，显示 NTFS 磁盘、状态与挂载按钮
  cap1: 主窗口
