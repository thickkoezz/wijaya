install:
  eyebrow: 安装
  title: 完整指南（5 步）
  lead: 大约 5 分钟。需要 Homebrew 与 Apple Silicon 上的 macOS 14+。
  s1_title: 安装 FUSE-T（前置条件）
  s1_desc: FUSE-T 提供无需内核扩展的 FUSE 层。
  s2_title: 下载并安装 Wijaya
  s2_desc: 从 Releases 获取 <code>.dmg</code>，打开后运行安装器。由于没有 Apple 签名，请用<strong>右键 → 打开</strong>。
  s3_title: 授予 Full Disk Access
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>。必须授予，因为 macOS 连 root 都拦截 <code>/dev/disk</code>。
  s4_title: 打开 Wijaya 并挂载
  s4_desc: 插入 NTFS 磁盘 → 点击 <strong>Mount Read-Write</strong> → 输入管理员密码。
  s5_title: 拔出前务必先 Eject
  s5_desc: FUSE-T 有写入缓存。先点 <strong>Eject</strong>，再拔出。
  readme: 想从源码构建？完整步骤都在 README 里。
faq:
  eyebrow: FAQ
  title: 常见问题
  q1: 为什么会出现 “unidentified developer” 警告？
  a1: 因为安装包没有 Apple 签名。官方签名需要每年 99 美元的 Apple Developer Program，而本项目选择保持免费。
  q2: 为什么需要 Full Disk Access？
  a2: 自 macOS Sequoia 起，TCC 连 root 进程访问 <code>/dev/disk</code> 也会拦截。
  q3: 出现了 “NTFS hibernated / unsafe state”。
  a3: 该磁盘没有从 Windows 正常关机（Fast Startup）。启动 Windows，关闭 Fast Startup，然后完全关机。
  q4: 对重要数据安全吗？
  a4: 拔出前务必点击 <strong>Eject</strong>。并且请保留备份。
