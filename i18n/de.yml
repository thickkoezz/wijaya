meta:
  title: Wijaya — NTFS-Datenträger auf dem Mac lesen und schreiben (kostenlos, Open Source)
  description: Wijaya macht NTFS-Datenträger — HDD, SSD oder NVMe — unter macOS beschreibbar. Kostenlos, Open Source (MIT), basiert auf ntfs-3g + FUSE-T.
