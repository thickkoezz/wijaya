hero:
  eyebrow: Kostenlos &amp; Open Source · MIT
  title: NTFS-Datenträger auf dem Mac lesen und schreiben — ohne kostenpflichtige Software.
  lead: Wijaya macht <strong>NTFS-Datenträger</strong> — HDD, SSD, NVMe, USB-Sticks — im Finder beschreibbar, auf Basis von <code>ntfs-3g</code> + FUSE-T.
  download: Herunterladen (.dmg)
  source: Quellcode ansehen
  note: <strong>Keine kostenpflichtige Developer ID.</strong> Das Paket ist nicht von Apple signiert; beim ersten Öffnen genügt <strong>Rechtsklick → Öffnen</strong> (oder Installation per Homebrew, die die Warnung überspringt). Danke fürs Verständnis.
  shot_caption: Wijaya.app — Datenträgererkennung, Mounten mit einem Klick, transparentes Log.
features:
  eyebrow: Warum Wijaya
  title: Funktioniert, wo andere kostenlose Tools aufgeben
  c1_title: Ohne kext (FUSE-T)
  c1_desc: Keine Kernel-Erweiterung, keine verringerte Systemsicherheit und kein Neustart in den Recovery-Modus.
  c2_title: Echtes Lesen &amp; Schreiben
  c2_desc: Read-Write-Mount über <code>ntfs-3g</code>, dazu Read-Only, Unmount, Eject und Repair.
  c3_title: Auto-Mount
  c3_desc: Optional — sobald ein NTFS-Datenträger eingesteckt wird, wird er ohne Klick und ohne Passwort read-write gemountet.
format:
  eyebrow: Formate &amp; Medien
  title: Entscheidend ist das Dateisystem, nicht die Art des Datenträgers
  lead: HDD, SSD, NVMe, USB-Stick, SD-Karte — alles gleich. Wijaya konzentriert sich auf NTFS.
  n_title: NTFS → braucht Wijaya
  n_desc: macOS kann NTFS nur <em>lesen</em>. Wijaya ermöglicht volles Lesen und Schreiben über <code>ntfs-3g</code>, auch bei NTFS-formatierten SSDs.
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: Unter macOS bereits les- und schreibbar. Wijaya zeigt sie trotzdem mit Status an.
  footnote: ext4 / Btrfs (Linux) werden noch nicht unterstützt.
shots:
  eyebrow: Screenshots
  title: Sieht aus wie eine ganz normale Mac-App
  alt1: Wijaya-Fenster mit einem NTFS-Datenträger, Status und Mount-Schaltfläche
  cap1: Hauptfenster
