install:
  eyebrow: Installation
  title: Komplette Anleitung (5 Schritte)
  lead: Etwa 5 Minuten. Erfordert Homebrew und macOS 14+ auf Apple Silicon.
  s1_title: FUSE-T installieren (Voraussetzung)
  s1_desc: FUSE-T liefert die FUSE-Schicht ohne Kernel-Erweiterung.
  s2_title: Wijaya herunterladen &amp; installieren
  s2_desc: Lade die <code>.dmg</code> aus den Releases, öffne sie und starte den Installer. Da nicht von Apple signiert, mit <strong>Rechtsklick → Öffnen</strong> öffnen.
  s3_title: Full Disk Access erteilen
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>. Pflicht, denn macOS blockiert <code>/dev/disk</code> selbst für root.
  s4_title: Wijaya öffnen &amp; mounten
  s4_desc: NTFS-Datenträger anstecken → <strong>Mount Read-Write</strong> klicken → Admin-Passwort eingeben.
  s5_title: Vor dem Abstecken immer auswerfen
  s5_desc: FUSE-T nutzt einen Schreib-Cache. Erst <strong>Eject</strong> klicken, dann abstecken.
  readme: Lieber aus dem Quellcode bauen? Alle Schritte stehen im README.
faq:
  eyebrow: FAQ
  title: Häufige Fragen
  q1: Warum die Warnung „unidentified developer“?
  a1: Weil das Paket nicht von Apple signiert ist. Offizielle Signierung erfordert das Apple Developer Program für 99 $/Jahr — dieses Projekt bleibt bewusst kostenlos.
  q2: Warum ist Full Disk Access nötig?
  a2: Seit macOS Sequoia blockiert TCC den Zugriff auf <code>/dev/disk</code> selbst für root-Prozesse.
  q3: Ich bekam „NTFS hibernated / unsafe state“.
  a3: Der Datenträger wurde nicht sauber aus Windows heruntergefahren (Fast Startup). Windows starten, Fast Startup deaktivieren, dann vollständig herunterfahren.
  q4: Ist es sicher für wichtige Daten?
  a4: Vor dem Abstecken immer <strong>Eject</strong> klicken. Und Backups behalten.
