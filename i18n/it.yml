meta:
  title: Wijaya — Leggere e scrivere dischi NTFS su Mac (gratuito e open source)
  description: Wijaya permette di leggere e scrivere dischi NTFS — HDD, SSD o NVMe — su macOS. Gratuito, open source (MIT), basato su ntfs-3g + FUSE-T.
