install:
  eyebrow: Installazione
  title: Guida completa (5 passi)
  lead: Circa 5 minuti. Richiede Homebrew e macOS 14+ su Apple Silicon.
  s1_title: Installa FUSE-T (prerequisito)
  s1_desc: FUSE-T fornisce il livello FUSE senza estensione kernel.
  s2_title: Scarica e installa Wijaya
  s2_desc: Prendi il <code>.dmg</code> da Releases, aprilo ed esegui l'installer. Non essendo firmato Apple, aprilo con <strong>clic destro → Apri</strong>.
  s3_title: Concedi Full Disk Access
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>. Obbligatorio: macOS blocca <code>/dev/disk</code> anche per root.
  s4_title: Apri Wijaya e monta
  s4_desc: Collega il tuo disco NTFS → clicca <strong>Mount Read-Write</strong> → inserisci la password admin.
  s5_title: Espelli sempre prima di scollegare
  s5_desc: FUSE-T usa una cache di scrittura. Clicca prima <strong>Eject</strong>, poi scollega.
  readme: Preferisci compilare dai sorgenti? I passi completi sono nel README.
faq:
  eyebrow: FAQ
  title: Domande frequenti
  q1: Perché l'avviso “unidentified developer”?
  a1: Perché il pacchetto non è firmato da Apple. La firma ufficiale richiede l'Apple Developer Program a 99 $/anno, e questo progetto ha scelto di restare gratuito.
  q2: Perché serve Full Disk Access?
  a2: Da macOS Sequoia, TCC blocca l'accesso a <code>/dev/disk</code> anche per i processi root.
  q3: Mi è apparso “NTFS hibernated / unsafe state”.
  a3: Il disco non è stato spento correttamente da Windows (Fast Startup). Avvia Windows, disattiva Fast Startup e fai un arresto completo.
  q4: È sicuro per dati importanti?
  a4: Clicca sempre <strong>Eject</strong> prima di scollegare. E tieni i backup.
