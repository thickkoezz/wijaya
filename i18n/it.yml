hero:
  eyebrow: Gratuito e open source · MIT
  title: Leggi e scrivi dischi NTFS sul Mac, senza software a pagamento.
  lead: Wijaya rende i <strong>dischi NTFS</strong> — HDD, SSD, NVMe, chiavette USB — scrivibili dal Finder, grazie a <code>ntfs-3g</code> + FUSE-T.
  download: Scarica (.dmg)
  source: Vedi il codice
  note: <strong>Nessun Developer ID a pagamento.</strong> Il pacchetto non è firmato da Apple, quindi la prima volta basta <strong>clic destro → Apri</strong> (o installa con Homebrew, che evita l'avviso). Grazie per la comprensione.
  shot_caption: Wijaya.app — rilevamento volumi, mount con un clic, log trasparente.
features:
  eyebrow: Perché Wijaya
  title: Funziona dove gli altri tool gratuiti si arrendono
  c1_title: Senza kext (FUSE-T)
  c1_desc: Nessuna estensione kernel, nessuna riduzione della sicurezza di sistema e nessun riavvio in Recovery Mode.
  c2_title: Lettura e scrittura vere
  c2_desc: Mount Read-Write tramite <code>ntfs-3g</code>, più Read-Only, Unmount, Eject e Repair.
  c3_title: Mount automatico
  c3_desc: Opzionale — quando colleghi un disco NTFS viene montato in read-write senza clic e senza password.
format:
  eyebrow: Formati e supporti
  title: Conta il filesystem, non il tipo di disco
  lead: HDD, SSD, NVMe, chiavetta, scheda SD — è lo stesso. Wijaya si concentra su NTFS.
  n_title: NTFS → serve Wijaya
  n_desc: macOS può solo <em>leggere</em> l'NTFS. Wijaya dà lettura e scrittura complete con <code>ntfs-3g</code>, anche su SSD formattati NTFS.
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: Già leggibili e scrivibili su macOS. Wijaya li elenca comunque con il loro stato.
  footnote: ext4 / Btrfs (Linux) non sono ancora supportati.
