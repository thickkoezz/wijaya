hero:
  eyebrow: Gratuit et open source · MIT
  title: Lisez et écrivez vos disques NTFS sur Mac, sans logiciel payant.
  lead: Wijaya rend les <strong>disques NTFS</strong> — HDD, SSD, NVMe, clés USB — inscriptibles dans le Finder, grâce à <code>ntfs-3g</code> + FUSE-T.
  download: Télécharger (.dmg)
  source: Voir le code
  note: <strong>Pas de Developer ID payant.</strong> Le paquet n'est pas signé par Apple : au premier lancement, faites simplement <strong>clic droit → Ouvrir</strong> (ou installez via Homebrew, qui évite l'avertissement). Merci de votre compréhension.
  shot_caption: Wijaya.app — détection des volumes, montage en un clic, journal transparent.
features:
  eyebrow: Pourquoi Wijaya
  title: Fonctionne là où les autres outils gratuits échouent
  c1_title: Sans kext (FUSE-T)
  c1_desc: Aucune extension noyau, aucune baisse de sécurité du système et aucun redémarrage en mode Recovery.
  c2_title: Vraie lecture/écriture
  c2_desc: Montage Read-Write via <code>ntfs-3g</code>, plus Read-Only, Unmount, Eject et Repair.
  c3_title: Montage automatique
  c3_desc: En option — dès qu'un disque NTFS est branché, il est monté en read-write sans clic ni mot de passe.
format:
  eyebrow: Formats et supports
  title: C'est le système de fichiers qui compte, pas le type de disque
  lead: HDD, SSD, NVMe, clé USB, carte SD — c'est pareil. Wijaya se concentre sur NTFS.
  n_title: NTFS → nécessite Wijaya
  n_desc: macOS ne peut que <em>lire</em> le NTFS. Wijaya offre une lecture-écriture complète via <code>ntfs-3g</code>, y compris sur les SSD formatés en NTFS.
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: Déjà en lecture-écriture sur macOS. Wijaya les affiche quand même avec leur état.
  footnote: ext4 / Btrfs (Linux) ne sont pas encore pris en charge.
shots:
  eyebrow: Captures
  title: L'apparence d'une app Mac classique
  alt1: Fenêtre de Wijaya montrant un disque NTFS avec son état et le bouton de montage
  cap1: Fenêtre principale
  alt2: Panneau FUSE-T montrant une connexion active via NFS
