meta:
  title: Wijaya — Lecture/écriture NTFS sur Mac (gratuit et open source)
  description: Wijaya permet de lire et écrire des disques NTFS — HDD, SSD ou NVMe — sur macOS. Gratuit, open source (MIT), basé sur ntfs-3g + FUSE-T.
