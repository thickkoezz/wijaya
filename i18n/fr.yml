install:
  eyebrow: Installation
  title: Guide complet (5 étapes)
  lead: Environ 5 minutes. Nécessite Homebrew et macOS 14+ sur Apple Silicon.
  s1_title: Installer FUSE-T (prérequis)
  s1_desc: FUSE-T fournit la couche FUSE sans extension noyau.
  s2_title: Télécharger et installer Wijaya
  s2_desc: Prenez le <code>.dmg</code> dans Releases, ouvrez-le puis lancez l'installeur. N'étant pas signé par Apple, ouvrez-le avec <strong>clic droit → Ouvrir</strong>.
  s3_title: Accorder Full Disk Access
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>. Obligatoire, car macOS bloque <code>/dev/disk</code> même pour root.
  s4_title: Ouvrir Wijaya et monter
  s4_desc: Branchez votre disque NTFS → cliquez sur <strong>Mount Read-Write</strong> → saisissez votre mot de passe admin.
  s5_title: Toujours éjecter avant de débrancher
  s5_desc: FUSE-T utilise un cache d'écriture. Cliquez sur <strong>Eject</strong> d'abord, puis débranchez.
  readme: Vous préférez compiler depuis les sources ? Les étapes sont dans le README.
faq:
  eyebrow: FAQ
  title: Questions fréquentes
  q1: Pourquoi l'avertissement « unidentified developer » ?
  a1: Parce que le paquet n'est pas signé par Apple. La signature officielle exige l'Apple Developer Program à 99 $/an, et ce projet a choisi de rester gratuit.
  q2: Pourquoi Full Disk Access est-il nécessaire ?
  a2: Depuis macOS Sequoia, TCC bloque l'accès à <code>/dev/disk</code> même pour les processus root.
  q3: J'ai eu « NTFS hibernated / unsafe state ».
  a3: Le disque n'a pas été arrêté proprement depuis Windows (Fast Startup). Démarrez Windows, désactivez Fast Startup, puis faites un arrêt complet.
  q4: Est-ce sûr pour des données importantes ?
  a4: Cliquez toujours sur <strong>Eject</strong> avant de débrancher. Et gardez des sauvegardes.
