meta:
  title: Wijaya — Read &amp; write NTFS disks on Mac (free &amp; open source)
  description: Wijaya lets you read and write NTFS disks — HDD, SSD or NVMe — on macOS. Free, open source (MIT), built on ntfs-3g + FUSE-T.
