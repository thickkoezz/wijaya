hero:
  eyebrow: Free &amp; open source · MIT
  title: Read &amp; write NTFS disks on your Mac — with no paid software.
  lead: Wijaya makes <strong>NTFS disks</strong> — HDD, SSD, NVMe, flash drives — writable in Finder, built on <code>ntfs-3g</code> + FUSE-T.
  download: Download (.dmg)
  source: View source
  note: <strong>No paid Developer ID.</strong> The package isn't signed by Apple, so the first time you open it just <strong>right-click → Open</strong> (or install via Homebrew, which skips the warning). Thanks for understanding.
  shot_caption: Wijaya.app — volume detection, one-click mount, transparent logs.
features:
  eyebrow: Why Wijaya
  title: Works where other free tools give up
  c1_title: Kext-less (FUSE-T)
  c1_desc: No kernel extension, no lowering your system's security, and no reboot into Recovery Mode.
  c2_title: Real read &amp; write
  c2_desc: Read-Write mounting via <code>ntfs-3g</code>, plus Read-Only, Unmount, Eject and Repair.
  c3_title: Auto-mount
  c3_desc: Optional — when an NTFS disk is plugged in it mounts read-write with no click and no prompt.
format:
  eyebrow: Formats &amp; media
  title: The filesystem decides — not the kind of disk
  lead: HDD, SSD, NVMe, flash drive, SD card — all the same. Wijaya focuses on NTFS.
  n_title: NTFS → needs Wijaya
  n_desc: macOS can only <em>read</em> NTFS. Wijaya gives full read-write via <code>ntfs-3g</code>, including NTFS-formatted SSDs.
  o_title: exFAT · FAT32 · APFS · HFS+
  o_desc: Already read-write on macOS. Wijaya still lists them with their status.
  footnote: ext4 / Btrfs (Linux) are not supported yet.
shots:
