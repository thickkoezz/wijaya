install:
  eyebrow: Install
  title: Full guide (5 steps)
  lead: About 5 minutes. Requires Homebrew and macOS 14+ on Apple Silicon.
  s1_title: Install FUSE-T (prerequisite)
  s1_desc: FUSE-T provides the FUSE layer without a kernel extension.
  s2_title: Download &amp; install Wijaya
  s2_desc: Grab the <code>.dmg</code> from Releases, open it, then run the installer. Since it isn't signed by Apple, open it with <strong>right-click → Open</strong>.
  s3_title: Grant Full Disk Access
  s3_desc: System Settings → Privacy &amp; Security → <strong>Full Disk Access</strong> → <code>+</code> → <code>⌘⇧G</code>. Required, because macOS blocks <code>/dev/disk</code> even for root.
  s4_title: Open Wijaya &amp; mount
  s4_desc: Plug in your NTFS disk → click <strong>Mount Read-Write</strong> → enter your admin password.
  s5_title: Always Eject before unplugging
  s5_desc: FUSE-T has a write cache. Click <strong>Eject</strong> first, then unplug.
  readme: Prefer to build from source? Full steps are in the README.
faq:
  eyebrow: FAQ
  title: Frequently asked questions
  q1: Why the “unidentified developer” warning?
  a1: Because the package isn't signed by Apple. Official signing needs the Apple Developer Program at $99/year, and this project chose to stay free.
  q2: Why is Full Disk Access needed?
  a2: Since macOS Sequoia, TCC blocks access to <code>/dev/disk</code> even for root processes.
  q3: I got “NTFS hibernated / unsafe state”.
  a3: The drive wasn't shut down cleanly from Windows (Fast Startup). Boot Windows, turn Fast Startup off, then do a full Shutdown.
  q4: Is it safe for important data?
  a4: Always click <strong>Eject</strong> before unplugging. And keep backups.
