meta:
  title: Wijaya — อ่านและเขียนดิสก์ NTFS บน Mac (ฟรีและโอเพนซอร์ส)
  description: Wijaya ทำให้ดิสก์ NTFS — HDD, SSD หรือ NVMe — อ่านและเขียนได้บน macOS ฟรี โอเพนซอร์ส (MIT) ใช้ ntfs-3g + FUSE-T
