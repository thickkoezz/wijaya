name: Wijaya
options:
  bundleIdPrefix: dev.mieky
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    DEAD_CODE_STRIPPING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  Wijaya:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Wijaya
        PRODUCT_BUNDLE_IDENTIFIER: dev.mieky.wijaya
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        COMBINE_HIDPI_IMAGES: "YES"

  WijayaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/WijayaTests
    dependencies:
      - target: Wijaya
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mieky.wijaya.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Wijaya:
    build:
      targets:
        Wijaya: all
        WijayaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WijayaTests
    archive:
      config: Release
